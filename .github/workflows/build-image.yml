name: "Build Orange Pi AI Pro images"

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel release tag (e.g. 6.18.21, or latest)"
        required: false
        default: "latest"
      release:
        description: "Distro release"
        required: false
        default: "trixie"
        type: choice
        options:
          - trixie
          - noble
          - bookworm
      variants:
        description: "Image variants to build"
        required: false
        default: "minimal,default"
        type: choice
        options:
          - minimal
          - default
          - "minimal,default"

jobs:
  matrix:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        run: |
          variants="${{ inputs.variants }}"
          release="${{ inputs.release }}"
          json="["
          first=true
          for board in orangepiaipro20t orangepiaipro8t; do
            if [ "$board" = "orangepiaipro20t" ]; then model="20T"; else model="8T"; fi
            for v in ${variants//,/ }; do
              if [ "$first" = true ]; then first=false; else json+=","; fi
              if [ "$v" = "minimal" ]; then
                json+="{\"board\":\"${board}\",\"model\":\"${model}\",\"variant\":\"minimal\",\"build_minimal\":\"yes\",\"install_headers\":\"no\",\"release\":\"${release}\"}"
              else
                json+="{\"board\":\"${board}\",\"model\":\"${model}\",\"variant\":\"default\",\"build_minimal\":\"no\",\"install_headers\":\"yes\",\"release\":\"${release}\"}"
              fi
            done
          done
          json+="]"
          echo "include=${json}" >> "$GITHUB_OUTPUT"

  boot-tests:
    name: Test Orange Pi AI Pro boot integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run focused boot tests
        run: bash tools/test-opiai-uboot-extension.sh

  build:
    needs:
      - matrix
      - boot-tests
    name: "Build ${{ matrix.model }} ${{ matrix.variant }} (${{ matrix.release }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Build image
        env:
          OPIAI_KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          ./compile.sh build \
            BOARD=${{ matrix.board }} \
            BRANCH=current \
            RELEASE=${{ matrix.release }} \
            BUILD_MINIMAL=${{ matrix.build_minimal }} \
            BUILD_DESKTOP=no \
            INSTALL_HEADERS=${{ matrix.install_headers }} \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=xz \
            EXPERT=yes

      - name: Collect and rename artifacts
        id: output
        run: |
          # Determine distro name for release title
          case "${{ matrix.release }}" in
            trixie|bookworm) distro="Debian" ;;
            noble)           distro="Ubuntu" ;;
            *)               distro="${{ matrix.release }}" ;;
          esac
          variant="${{ matrix.variant }}"
          board="${{ matrix.board }}"
          model="${{ matrix.model }}"
          release="${{ matrix.release }}"
          kver="${{ inputs.kernel_version }}"

          release_tag="${board}-${distro}-${release}-${variant}"
          release_name="Armbian Orange Pi AI Pro ${model} ${distro} ${release^} ${variant}"

          mkdir -p release-assets
          for f in output/images/*.img.xz; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .img.xz)"
            cp "$f" "release-assets/${base}_${kver}.img.xz"
          done
          for f in output/images/*.img.xz.sha; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .img.xz.sha)"
            cp "$f" "release-assets/${base}_${kver}.img.xz.sha"
          done

          ls -lh release-assets/
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.output.outputs.release_tag }}
          name: ${{ steps.output.outputs.release_name }}
          files: release-assets/*
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
