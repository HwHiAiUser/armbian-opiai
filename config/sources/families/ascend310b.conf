declare -g LINUXFAMILY="ascend310b"
declare -g ARCH="arm64"
declare -g KERNELSOURCE="none"
declare -g BOOTCONFIG="${BOOTCONFIG:-none}"
declare -g SERIALCON="${SERIALCON:-ttyAMA0}"

enable_extension "opiai"

case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;

	legacy)
		declare -g KERNEL_MAJOR_MINOR="5.10"
		;;
esac

family_tweaks_bsp() {
	:
}
