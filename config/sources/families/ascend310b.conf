declare -g LINUXFAMILY="ascend310b"
declare -g ARCH="arm64"
declare -g KERNELSOURCE="none"
declare -g SERIALCON="${SERIALCON:-ttyAMA0}"
declare -g ATF_COMPILE="no"

# hboot2 loads Image.hboot2 as its kernel payload. U-Boot then uses its
# standard distro boot flow to read extlinux, Image, DTB and uInitrd from the
# root filesystem.
declare -g BOOTSOURCE="https://github.com/HwHiAiUser/u-boot"
declare -g BOOTBRANCH="branch:v2026.01-ascend310b"
declare -g BOOTDIR="u-boot-ascend310b"
declare -g BOOTPATCHDIR="u-boot-ascend310b"
declare -g UBOOT_TARGET_MAP="all;;Image.hboot2 hboot2-uboot.raw"

# Keep the platform arguments that were formerly supplied by the vendor DTB.
# extlinux adds the root UUID and Armbian's common command line later.
declare -g SRC_CMDLINE="console=ttyAMA0,115200 console=tty1 log_redirect=0x1fc000@0x22741000 rodata=off syslog earlycon=pl011,mmio32,0xC4010000 rootwait mpam=of enable_ascend_share_pool ascend_enable_all enable_sp_multi_group_mode init_all_gicr enable_fpga use_kallsyms_lookup_symbol selinux=0 systemd.unified_cgroup_hierarchy=1 fbcon=map:6 movable_node cma=256M"

enable_extension "opiai-uboot"

case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;

	legacy)
		declare -g KERNEL_MAJOR_MINOR="5.10"
		;;
esac

family_tweaks_bsp() {
	:
}
